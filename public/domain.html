<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose your pathway — YojanaPath</title>
  <link rel="stylesheet" href="css/tokens.css?v=10">
  <link rel="stylesheet" href="css/base.css?v=10">
  <link rel="stylesheet" href="css/layout.css?v=10">
  <link rel="stylesheet" href="css/components.css?v=10">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark">Y</span>YojanaPath</a>
      <button id="menuBtn" class="btn ghost" aria-label="Open menu" aria-expanded="false"></button>
      <nav class="main" aria-label="Main"><a class="navlink"
          href="index.html">Home</a><a class="navlink" href="saved.html">Saved</a><a class="btn nav-cta"
          href="domain.html">Let's begin<svg class="nav-arrow" width="14" height="14" viewBox="0 0 14 14"
            aria-hidden="true">
            <path d="M2 7h9M7.5 3.5 11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.6" fill="none"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg></a></nav>
    </div>
  </header>
  <main id="main">
    <section class="band band-canvas picker-band" id="pickerView">
      <div class="wrap picker-wrap">
        <h1 class="picker-title">Choose your pathway</h1>
        <div id="dpicker" class="picker" role="radiogroup" aria-label="Choose a pathway">
          <div class="skel" aria-hidden="true"><i class="w60"></i><i class="w80"></i></div>
          <div class="skel" aria-hidden="true"><i class="w60"></i><i class="w80"></i></div>
        </div>
        <div class="picker-dots" id="pdots" aria-hidden="true"></div>
        <div class="picker-next"><button id="pnext" class="btn" disabled>Next &rarr;</button></div>
      </div>
    </section>
    <section class="band band-canvas" id="singleView" hidden>
      <div class="wrap" style="max-width:760px">
        <h1 id="dtitle">Explore support</h1>
        <p id="ddesc" class="lead">Loading…</p>
        <div class="card" style="margin-top:24px">
          <h2>What we will ask</h2>
          <ul id="dlist" class="ask-list"></ul>
          <p style="margin-top:24px"><a id="startBtn" class="btn" href="questionnaire.html">Start questionnaire
              &rarr;</a></p>
          <p class="meta-sub">Anonymous prototype — we never ask for Aadhaar numbers, bank details or medical records.
          </p>
        </div>
      </div>
    </section>
  </main>
  <script src="js/app.js?v=10"></script><script src="js/dropdown.js?v=10"></script>
  <script src="js/api.js?v=10"></script>
  <script>
    (function ($) {
      var VALID = { 'startup-funding': 1, 'health-coverage': 1 };
      var d = new URLSearchParams(location.search).get('domain');
      var ART = {
        'startup-funding': '<svg viewBox="0 0 120 96" width="120" height="96" aria-hidden="true" focusable="false"><rect x="16" y="58" width="18" height="22" rx="3" fill="#f54e00"/><rect x="38" y="44" width="18" height="36" rx="3" fill="#f54e00" opacity=".55"/><rect x="60" y="30" width="18" height="50" rx="3" fill="#f54e00" opacity=".3"/><path d="M90 62V26" stroke="#26251e" stroke-width="3.5" stroke-linecap="round"/><path d="M81 35l9-9 9 9" stroke="#26251e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
        'health-coverage': '<svg viewBox="0 0 120 96" width="120" height="96" aria-hidden="true" focusable="false"><path d="M60 14l32 13v24c0 19-13 29-32 35-19-6-32-16-32-35V27l32-13z" fill="#f54e00" opacity=".16"/><path d="M60 14l32 13v24c0 19-13 29-32 35-19-6-32-16-32-35V27l32-13z" fill="none" stroke="#26251e" stroke-width="3.5" stroke-linejoin="round"/><path d="M45 52h9l5-11 7 21 5-10h6" fill="none" stroke="#f54e00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };
      var chosen = null;
      function select(id) {
        chosen = id;
        $('#dpicker .pick-card').each(function () {
          var on = $(this).attr('data-domain') === id;
          $(this).attr('aria-checked', on ? 'true' : 'false').toggleClass('selected', on);
        });
        $('#pdots .dot').each(function (i) { $(this).toggleClass('on', i === (id === 'health-coverage' ? 1 : 0)); });
        $('#pnext').prop('disabled', !id);
      }
      function showSingle() {
        $('#pickerView').attr('hidden', true);
        $('#singleView').removeAttr('hidden');
        $('#startBtn').attr('href', 'questionnaire.html?domain=' + encodeURIComponent(d));
        $('#dtitle').text(d === 'health-coverage' ? 'Health coverage' : 'Startup funding');
        YPApi.categories().done(function (c) {
          var x = (c || []).find(function (y) { return y.id === d; });
          if (!x) { $('#ddesc').text('Start the questionnaire when you are ready.'); return; }
          $('#ddesc').text(x.description);
          $('#dlist').html(x.questionsAsked.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join(''));
        }).fail(function () { $('#ddesc').text('Could not load details — the questionnaire will still ask the right questions.'); });
      }
      if (d && VALID[d]) { showSingle(); return; }
      $('#pnext').on('click', function () { if (chosen) location.href = 'questionnaire.html?domain=' + encodeURIComponent(chosen); });
      $('#dpicker').on('click', '.pick-card', function () { select($(this).attr('data-domain')); });
      YPApi.categories().done(function (c) {
        var list = c || [];
        $('#dpicker').html(list.map(function (x) {
          return '<button type="button" class="pick-card" data-domain="' + esc(x.id) + '" role="radio" aria-checked="false">' +
            '<span class="pick-art">' + (ART[x.id] || '') + '</span>' +
            '<span class="pick-title">' + esc(x.title) + '</span>' +
            '<span class="pick-desc">' + esc(x.tagline) + '</span>' +
            '</button>';
        }).join('') || '<div class="alert">Could not load pathways. <a href="questionnaire.html?domain=startup-funding">Start with startup funding</a>.</div>');
        $('#pdots').html(list.map(function () { return '<span class="dot"></span>'; }).join(''));
      }).fail(function () {
        $('#dpicker').html('<div class="alert">Could not load pathways. <a href="questionnaire.html?domain=startup-funding">Start with startup funding</a> or <a href="questionnaire.html?domain=health-coverage">health coverage</a>.</div>');
        $('#pdots, .picker-next').hide();
      });
    })(jQuery);
  </script>
</body>

</html>
